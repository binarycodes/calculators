name: CI

on:
  push:
    branches: ['**']

# A newer push to the same branch cancels an in-progress run for that branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: maven verify
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: maven verify
        env:
          VAADIN_SERVER_LICENSE: ${{ secrets.VAADIN_SERVER_LICENSE }}
        run: mvn --batch-mode --no-transfer-progress -Dvaadin.offlineKey="$VAADIN_SERVER_LICENSE" -Dbuild.commit=${{ github.sha }} clean verify

  docker:
    name: build and publish docker image
    needs: verify
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/docker.yml
    secrets: inherit
    with:
      sha: ${{ github.sha }}
