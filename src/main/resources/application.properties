server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Off by default because trusting X-Forwarded-* is only safe behind a proxy.
# Operators terminating TLS should set this to `native`: that routes through
# Tomcat's RemoteIpValve, which updates the request scheme early enough for the
# session cookie to be marked Secure. `framework` does not — it wraps the request
# above the container, after the cookie is written.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.servlet.session.cookie.same-site=lax

# The app has no authentication, so there is no user store to auto-configure.
# Left in, Boot would invent an in-memory user and log a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Don't auto-launch the browser; we run the dev server headless.
vaadin.launch-browser=false

# Keep Copilot's dev-mode overlay off the running app.
vaadin.copilot.enable=false

# An open tab's heartbeat otherwise keeps its session alive indefinitely, so the
# servlet session-timeout never fires.
vaadin.closeIdleSessions=true

# Restrict component scanning for faster dev startup.
# https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,io.binarycodes.calculators

# Whether a calculator opens with its sample scenario when the visitor has
# nothing saved yet. Set to false for a blank form; that also drops the Reset
# action, which exists only to restore the sample scenario.
app.calculators.prefill-defaults=${CALCULATORS_PREFILL_DEFAULT_VALUES:true}

# External links shown in the drawer footer.
app.links.vaadin=https://vaadin.com
app.links.github=https://github.com/binarycodes/calculators
