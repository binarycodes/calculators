server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# The app has no authentication, so there is no user store to auto-configure.
# Left in, Boot would invent an in-memory user and log a generated password.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Don't auto-launch the browser; we run the dev server headless.
vaadin.launch-browser=false

# An open tab's heartbeat otherwise keeps its session alive indefinitely, so the
# servlet session-timeout never fires.
vaadin.closeIdleSessions=true

# Restrict component scanning for faster dev startup.
# https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,io.binarycodes.calculators

# External links shown in the drawer footer.
app.links.vaadin=https://vaadin.com
app.links.github=https://github.com/binarycodes/calculators
